server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    # 注意：pom 中 mysql-connector-java 为 5.1.47，仅识别 com.mysql.jdbc.Driver；
    # 若日后升级到 8.x，请把驱动类改为 com.mysql.cj.jdbc.Driver
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    # 已核实：本机 Redis(3.2.100) 的 redis.windows.conf / redis.windows-service.conf 均设 requirepass 1234，此处必须保留
    password: 1234
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON 序列化时忽略值为 null 的字段
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
  mapper-locations: classpath*:/mapper/**/*.xml # XML Mapper 扫描路径
logging:
  level:
    com.hmdp: debug